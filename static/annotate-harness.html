<!doctype html>
<html lang="ca">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>annotate harness</title>
		<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #14100c;
				color: #efe4cf;
				font-family: system-ui, sans-serif;
			}
			#map {
				position: absolute;
				inset: 0;
			}
			:root {
				--color-table-900: #14100c;
				--color-table-800: #1d1710;
				--color-table-700: #2a2119;
				--color-table-600: #3a2f23;
				--color-table-500: #4d3f2f;
				--color-brass-500: #b8893f;
				--color-brass-400: #cfa25a;
				--color-brass-300: #e0bd85;
				--color-paper: #efe4cf;
				--color-paper-dim: #bfb19a;
				--color-hazard: #d4553f;
				--color-buoy: #e0a32e;
				--radius-rail: 0.5rem;
				--spacing-touch: 2.75rem;
				--rail-shadow: 0 2px 10px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(184 137 63 / 0.22);
				--sunk: inset 0 1px 2px rgb(0 0 0 / 0.5);
				color-scheme: dark;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<div id="tools"></div>
		<script>
			// $app/paths reads these. The real app gets them from the SSR payload and Vite define.
			window.__SVELTEKIT_PAYLOAD__ = { base: '', assets: '' };
			window.__SVELTEKIT_PATHS_BASE__ = '';
			window.__SVELTEKIT_PATHS_ASSETS__ = '';
			window.__SVELTEKIT_APP_DIR__ = '_app';
			window.__SVELTEKIT_HASH_ROUTING__ = false;
		</script>
		<script type="module">
			const report = (stage, detail) => {
				window.harness = { ...(window.harness ?? {}), [stage]: detail };
			};

			try {
				// The app's own maplibre instance, taken from a module Vite compiled. A second
				// copy would give this page a different GeoJSONSource class, and the panel's
				// `instanceof` narrowing would quietly refuse to write to the source.
				const panelSource = await (await fetch('/src/lib/annotate/AnnotatePanel.svelte')).text();
				const maplibreUrl = /from "([^"]*maplibre-gl\.mjs[^"]*)"/.exec(panelSource)[1];
				const { Map: MapLibre, addProtocol } = await import(maplibreUrl);
				const { Protocol } = await import('/node_modules/pmtiles/dist/esm/index.js');
				const { buildStyle } = await import('/src/lib/map/style.ts');

				addProtocol('pmtiles', new Protocol().tile);

				const style = buildStyle({
					isobaths: { intervalM: 5, emphasised: [5, 18, 30, 40, 50], maxDepthM: 80, labels: true },
					visible: ['hillshade', 'depth-tint', 'isobaths', 'habitats', 'coastline', 'osm', 'annotations'],
					groundLayer: 'habitats'
				});

				const map = new MapLibre({
					container: 'map',
					style,
					center: [3.2165, 41.9275],
					zoom: 13.4,
					maxPitch: 0,
					canvasContextAttributes: { preserveDrawingBuffer: true }
				});

				window.diveMap = map;
				report('style', {
					annotationLayers: style.layers.filter((l) => l.id.startsWith('annotation')).map((l) => l.id),
					annotationsSource: style.sources.annotations
				});

				map.on('load', () => {
					window.mapReady = true;
				});
				map.on('error', (e) => {
					report('mapError', String(e.error?.message ?? e));
				});

				try {
					// Mount through the app's own SvelteControl. Importing `mount` here would
					// pull a second Svelte instance whose scheduler never flushes these effects.
					// Vite stamps HMR-updated modules with ?t=. Importing the bare path would
					// hand this page a second copy of controls.ts whose map registry the
					// component never sees, so take the exact URL the component was served.
					const compiled = await (await fetch('/src/lib/ui/AnnotateTools.svelte')).text();
					const controlsUrl = /from "(\/src\/lib\/map\/controls\.ts[^"]*)"/.exec(compiled)[1];
					const { SvelteControl, publishMap } = await import(controlsUrl);
					const AnnotateTools = (await import('/src/lib/ui/AnnotateTools.svelte')).default;
					const register = () => {
						publishMap(map);
						map.addControl(new SvelteControl(AnnotateTools, { props: { locale: 'ca' }, className: '' }), 'bottom-left');
						window.toolsMounted = true;
					};
					if (map.loaded()) register();
					else map.on('load', register);
				} catch (e) {
					window.toolsError = String(e && e.stack ? e.stack : e);
				}
			} catch (e) {
				window.harnessError = String(e && e.stack ? e.stack : e);
			}
		</script>
	</body>
</html>
